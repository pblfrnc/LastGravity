<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>(function(){var t=new URLSearchParams(location.search).get('theme')||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;})();</script>

<title>LastGravity</title>
<style>
  :root { --bg:#0f1117; --panel:#161922; --panel2:#1c2030; --line:#2a2f3f; --text:#e6e8ef; --muted:#8b91a5; --accent:#ff7a45; --accent2:#8b5cf6; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-user-select:none; user-select:none; }
  .drag { position:fixed; top:0; left:0; right:0; height:36px; -webkit-app-region:drag; }
  main { display:grid; grid-template-columns: 1fr 1.1fr; height:100%; }
  .hero { padding:64px 40px 32px; display:flex; flex-direction:column; gap:18px;  border-right:1px solid var(--line); }
  .hero img { width:72px; height:72px; }
  h1 { margin:0; font-size:30px; letter-spacing:-.02em; }
  .tag { color:var(--muted); font-size:14px; line-height:1.5; margin:0; }
  .btns { display:grid; gap:10px; margin-top:12px; }
  button { font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; text-align:left; display:flex; gap:12px; align-items:center; }
  button:hover { border-color:var(--muted); }
  button.primary { background:#c2410c; border:none; color:#fff; font-weight:600; }
  button .k { margin-left:auto; opacity:.6; font-size:12px; }
  .foot { margin-top:auto; color:var(--muted); font-size:12px; }
  .recent { padding:64px 28px 24px; display:flex; flex-direction:column; min-height:0; }
  .recent h2 { font-size:11px; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; }
  #list { overflow:auto; display:grid; gap:4px; align-content:start; }
  .item { padding:10px 12px; border-radius:8px; cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:2px 8px; }
  .item:hover { background:var(--panel2); }
  .item .n { font-weight:600; }
  .item .p { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }
  .item .x { grid-row:1/3; grid-column:2; align-self:center; opacity:0; color:var(--muted); padding:2px 6px; border-radius:4px; }
  .item:hover .x { opacity:1; } .item .x:hover { background:var(--line); color:var(--text); }
  .empty { color:var(--muted); line-height:1.7; padding:12px; }
  /* ===== revisão de layout ===== */
  :root { --btn-grad:#c2410c; --accent-text:#8fb3ff; }
  button.primary { background:var(--btn-grad); }
  button.primary:hover { filter:brightness(1.12); }
  button { min-height:44px; }
  :focus { outline:none; }
  :focus-visible { outline:2px solid var(--accent-text); outline-offset:2px; }
  .hero { justify-content:center; padding:48px 48px 32px; }
  .hero > .foot { margin-top:0; position:absolute; bottom:28px; }
  .hero { position:relative; }
  .hero .btns { max-width:420px; }
  .tag { max-width:440px; }
  .recent { padding:56px 32px 24px; }
  .recent h2 { padding:0 12px; }
  .item { gap:3px 8px; outline-offset:-2px; }
  .item:focus-visible { background:var(--panel2); }
  /* caminho cortado à esquerda sem inverter a barra inicial (direction:rtl jogava "/" para o fim) */
  .item .p::before, .item .p::after { content:"\200E"; }
  .item:focus-within .x, .item:focus-visible .x { opacity:1; }
  .item .x { min-width:24px; min-height:24px; display:grid; place-items:center; }
  .empty { border:1px dashed var(--line); border-radius:10px; padding:20px; margin:0 12px; }
  ::-webkit-scrollbar { width:10px; } ::-webkit-scrollbar-thumb { background:#2a2f3f; border-radius:8px; border:2px solid transparent; background-clip:padding-box; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } .hero { border-right:none; border-bottom:1px solid var(--line); } }

  [data-theme="light"] { --bg:#ffffff; --panel:#f6f7f9; --panel2:#eef0f3; --line:#e1e4e8; --text:#1d2025; --muted:#5f6672; --accent:#c2410c; --accent2:#2563eb; --accent-text:#1d4ed8; color-scheme: light; }
  button.primary { background:#c2410c !important; color:#fff; }
  button.primary:hover { background:#9a3412 !important; filter:none !important; }
  [data-theme="light"] html, [data-theme="light"] body, html[data-theme="light"] body { background:var(--bg); color:var(--text); }
</style>
</head>
<body>
<div class="drag"></div>
<main>
  <section class="hero">
    <img src="../public/icon.svg" alt="" style="width:88px;height:88px;margin-left:-8px">
    <h1>LastGravity</h1>
    <p class="tag">IDE com agentes de IA que planejam, escrevem código, rodam comandos e verificam o próprio trabalho. Use Claude, Gemini, OpenAI ou modelos locais grátis.</p>
    <div class="btns">
      <button class="primary" id="open">📂 Abrir pasta <span class="k">⌘O</span></button>
      <button id="new">✨ Novo projeto</button>
    </div>
    <div class="foot" id="ver"></div>
  </section>
  <section class="recent">
    <h2>RECENTES</h2>
    <div id="list"></div>
  </section>
</main>
<script>
  const lg = window.lastgravity;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  async function render() {
    const items = await lg.recent();
    const list = document.getElementById('list');
    list.innerHTML = items.length
      ? items.map((r) => `<div class="item" tabindex="0" role="button" data-p="${esc(r.path)}"><span class="n">${esc(r.name)}</span><span class="p" title="${esc(r.path)}">${esc(r.path)}</span><span class="x" data-rm="${esc(r.path)}" title="Remover da lista" aria-label="Remover da lista">✕</span></div>`).join('')
      : '<div class="empty">Nenhum projeto ainda.<br>Abra uma pasta para começar.</div>';
  }
  document.getElementById('open').onclick = () => lg.openFolder();
  document.getElementById('new').onclick = () => lg.newProject();
  document.getElementById('list').onclick = async (e) => {
    if (e.target.dataset.rm) { await lg.removeRecent(e.target.dataset.rm); return render(); }
    const it = e.target.closest('.item');
    if (it) lg.open(it.dataset.p);
  };
  document.getElementById('list').addEventListener('keydown', (e) => {
    const it = e.target.closest('.item');
    if (!it) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); lg.open(it.dataset.p); }
    else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); lg.removeRecent(it.dataset.p).then(render); }
  });
  lg.version().then((v) => { document.getElementById('ver').textContent = `Versão ${v} · licença MIT`; });
  render();
</script>
</body>
</html>
